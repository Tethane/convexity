[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convexity"
version = "0.1.0"
description = "Generic mathematical tools for quantitative modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "findiff>=0.12.1",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.408"]
autodiff = ["torch>=2.2"]
neural = ["torch>=2.2"]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.9", "pandas>=2.2"]

[tool.setuptools.packages.find]
include = ["convexity*"]
namespaces = false

[tool.pyright]
include = ["convexity", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
cache_dir = ".cache/pytest"

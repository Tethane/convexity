[build-system]
requires = [
    "scikit-build-core>=0.9",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "convexity"
version = "0.1.0"
description = "A minimal foundation for the Convexity quantitative SDK."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "../LICENSE" }
authors = [{ name = "Convexity contributors" }]
optional-dependencies.dev = ["pytest>=8.0"]

[tool.scikit-build]
cmake.source-dir = ".."
wheel.packages = []

[tool.scikit-build.cmake.define]
CONVEXITY_BUILD_CLIENT = "OFF"
CONVEXITY_BUILD_TESTS = "OFF"

